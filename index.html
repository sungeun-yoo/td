<!DOCTYPE html>
<html>
<head>
    <title>Phaser Circle Animation Example</title>
    <!-- Phaser 라이브러리를 불러옵니다 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <!-- dat.GUI 라이브러리를 불러옵니다 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #333; /* 페이지 배경색 */
        }
        /* 캔버스가 부모 요소에 꽉 차도록 설정하여 반응형으로 만듭니다. */
        canvas {
            max-width: 100%;
            max-height: 100%;
        }
    </style>
    <style>
        /* Custom styles for dat.GUI to make it larger for better visibility */
        .dg.main {
            font-size: 18px; /* Increase base font size */
            width: 350px !important; /* Force a wider GUI */
        }
        .dg.main .cr {
            padding: 10px 0; /* Add padding to rows */
            line-height: 1.5;
        }
        .dg.main .cr.function, .dg.main .cr.boolean {
            height: 40px; /* Increase height for buttons and checkboxes */
            line-height: 40px;
        }
        .dg li.title {
            height: 45px; /* Increase folder title height */
            line-height: 45px;
        }
        .dg .c select {
            font-size: 18px; /* Increase font size for dropdowns */
        }
        .dg .c .slider {
            height: 20px; /* Make sliders easier to grab */
        }
    </style>
</head>
<body>

<script type="module" src="js/game.js"></script>

</body>
</html>
